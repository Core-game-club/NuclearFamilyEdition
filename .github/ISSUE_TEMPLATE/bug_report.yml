name: "버그 제보"
description: "모드팩 플레이 중 발생한 버그를 제보합니다."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        버그 제보 감사합니다. 아래 항목을 최대한 자세히 작성해주세요.

  - type: textarea
    id: description
    attributes:
      label: "버그 설명"
      description: "어떤 버그가 발생했는지 설명해주세요."
      placeholder: "예: 특정 아이템을 우클릭하면 게임이 멈춤"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "재현 방법"
      description: "버그를 재현할 수 있는 단계를 적어주세요."
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "예상 동작"
      description: "정상적으로 작동했다면 어떻게 되어야 하나요?"
    validations:
      required: false

  - type: input
    id: mod
    attributes:
      label: "관련 모드"
      description: "어떤 모드와 관련된 버그인지 알고 있다면 적어주세요."
      placeholder: "예: Create, Mekanism"
    validations:
      required: false

  - type: textarea
    id: log
    attributes:
      label: "크래시 로그"
      description: "크래시가 발생했다면 로그를 붙여넣어 주세요."
      render: text
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: "스크린샷"
      description: "버그 상황을 보여주는 스크린샷이 있다면 첨부해주세요."
    validations:
      required: false
